[project]
name = "rra"
version = "0.1.0"
description = "Regulatory Research Assistant — a multi-agent RAG system over FDA guidance documents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["llm", "rag", "agents", "langgraph", "mcp", "fda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # ─── Orchestration ──────────────────────────────────────────────────────
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",  # durable state in Postgres
    "langchain-anthropic>=0.3.0",            # Claude adapter for LangChain/LangGraph
    "langchain-core>=0.3.0",

    # ─── Model + embedding clients ──────────────────────────────────────────
    "anthropic>=0.40.0",                      # used directly by judge + as fallback
    "voyageai>=0.3.0",                        # embeddings + reranker

    # ─── API gateway ────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # ─── Postgres + vector store ────────────────────────────────────────────
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.0",

    # ─── MCP server ─────────────────────────────────────────────────────────
    "mcp>=1.0.0",                             # official Anthropic MCP SDK

    # ─── Observability + evals ──────────────────────────────────────────────
    "langfuse>=2.50.0",

    # ─── Config + utilities ─────────────────────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",                          # for the corpus downloader and clients
    "tenacity>=9.0.0",                        # retry decorator for API + HTTP calls
    "structlog>=24.4.0",                      # structured logging that plays well with Langfuse
    "pypdf>=5.0.0",                           # parsing FDA guidance PDFs in the ingest script
    "tiktoken>=0.8.0",                        # token counting for chunking and cost reporting
]

[project.optional-dependencies]
# Install with: `uv sync --extra cloud`
# Only needed if you're building the AgentCore deployment variant in week 2.
cloud = [
    "boto3>=1.35.0",
    "bedrock-agentcore>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipython>=8.30.0",                        # better REPL for debugging
    "rich>=13.9.0",                           # nicer console output for the eval runner
]

[project.scripts]
# Lets you run `rra-evals` and `rra-ingest` from anywhere in the venv.
rra-evals = "rra.evals.run:main"
rra-ingest = "rra.ingest:main"

[project.urls]
Repository = "https://github.com/YOU/regulatory-research-assistant"
Documentation = "https://github.com/YOU/regulatory-research-assistant/blob/main/docs/spec.md"

# ─── Build system ───────────────────────────────────────────────────────────
# hatchling is uv's default backend and handles the src/ layout cleanly.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rra"]

# ─── Tooling configuration ──────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax)
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # `assert` is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# Third-party packages without type stubs — silence "missing imports" complaints.
# Trim this list as upstream packages ship stubs.
[[tool.mypy.overrides]]
module = [
    "voyageai.*",
    "pgvector.*",
    "langfuse.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",                 # show summary of all non-passing tests
    "--strict-markers",    # fail on unknown marks
    "--strict-config",
    "--cov=rra",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"      # don't need @pytest.mark.asyncio on every async test

[tool.coverage.run]
source = ["src/rra"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",     # the eval stubs use this heavily on day 1
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
